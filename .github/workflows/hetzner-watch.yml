name: Hetzner auction watch

on:
  workflow_dispatch:          # started every minute by an external cron job (cron-job.org) via the GitHub API

permissions:
  contents: write             # lets the job save state.json back to the repo

concurrency:
  group: hetzner-watchs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check the auction
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 watch.py

      - name: Save state (only when it changed)
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update auction watch state"
            git push
          fi
